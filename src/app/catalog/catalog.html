<div class="container">
    <div class ="filters">
        <a class="button" (click)="filter='Earrings'">Earrings</a>
        <a class="button" (click)="filter='Necklaces'">Necklaces</a>
        <a class="button" (click)="filter='Bracelets'">Bracelets</a>
        <a class="button" (click)="filter='Sets'">Sets</a>
        <a class="button" (click)="filter=''">All</a>
    </div>

    <ul class="products">
        <li class="product-item" *ngFor="let product of getFilteredProducts()">
            <div class="product">
                <div class="product-details">
                    <img class= "product-image" [src]="getProductImageUrl(product)" [alt]="product.name"/>
                    <div class="product-info">
                        <div class="name"> {{product.name }}</div>
                        <div class="description"> {{product.description}}</div>
                        <div class="category">Type of: {{product.category}}</div>  
                    </div>                
                </div>
                <div class="price">
                    <div>&euro; {{product.price.toFixed(2)}}</div>
                    <button class="cta">Buy</button>
                </div>                
            </div>
        </li>
    </ul>
</div>
