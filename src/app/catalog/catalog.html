<div class="container">
    <div class="filters">
        <a class="button" [routerLink]="['/catalog', 'Earrings']">Earrings</a>
        <a class="button" [routerLink]="['/catalog', 'Necklaces']">Necklaces</a>
        <a class="button" [routerLink]="['/catalog', 'Bracelets']">Bracelets</a>
        <a class="button" [routerLink]="['/catalog', 'Sets']">Sets</a>
        <a class="button" [routerLink]="['/catalog', 'All']">All</a>
    </div>

    <ul class="products">
        @for(product of getFilteredProducts(); track product.id){
            <li class="product-item">
                <app-product-details [product]="product" (buy)="addToCart(product)"> </app-product-details>
            </li>
        }
    </ul>
</div>
