<nav class="menu">
  <button class="menu-toggle" (click)="toggleMenu()">☰</button>

  <div class="menu-links">
    <div class="left-links">
      <a routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/catalog" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Catalog</a>
      <a routerLink="/about" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">About</a>
      <a routerLink="/contacts" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Contacts</a>      
    </div>

    <div class="right-links">
      <a routerLink="/cart" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Cart</a>

      @if(!user){
        <a routerLink="/sign-in" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Sign In</a>        
      } @else {
        <img src="/assets/profile.png" (click)="toggleSignOutMenu()" width="60" height="35" alt="User Icon"/>
        @if(showSignOutMenu){
           <div class="sign-out"> 
              <a routerLink="/sign-out" (click)="signOut()" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Sign Out</a>
           </div>
        }
      }
    </div>
  </div>
</nav>

<router-outlet></router-outlet>
